<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Calendar ウィジェット配色</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;font-family:"Segoe UI",sans-serif;background:#e7ebf1;color:#243347}h1{font-size:24px;margin:0 0 8px}p{font-size:13px;color:#526073;margin:0 0 24px}.themes{display:grid;grid-template-columns:repeat(3,380px);gap:24px}h2{font-size:15px;margin:0 0 12px}.wall{padding:16px;background:linear-gradient(145deg,#a8c0ce,#d5c4bf 50%,#7693ae);border-radius:30px}.glass{position:relative;border-radius:22px;border:1px solid transparent;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 42%,var(--glow)),var(--tint);background-clip:padding-box;color:var(--ink);box-shadow:inset 0 1px 0 #ffffff9e,inset 1px 0 0 #ffffff55,inset 0 -1px 0 var(--edge);padding:12px;margin-bottom:14px}.glass:last-child{margin:0}.head{display:flex;justify-content:space-between;align-items:center;font-weight:700;height:28px}.nav{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px}.weekday{text-align:center;color:var(--secondary);padding:6px 0;font-size:10px}.cell{height:35px;text-align:center;padding:5px 1px;border-radius:5px}.today{background:var(--today);color:var(--accent);font-weight:bold}.event{font-size:7px;text-align:left;color:#327caa;white-space:nowrap;overflow:hidden;margin-top:3px}.agenda{display:flex;gap:18px;align-items:center;min-height:96px}.date{text-align:center;width:76px}.date b{display:block;font-size:36px}.detail{font-size:11px;color:var(--secondary);margin-top:5px}.item{border-left:4px solid #327caa;padding-left:10px}.item strong{font-size:16px}
@media(max-width:1200px){.themes{grid-template-columns:repeat(2,380px)}}@media(max-width:820px){body{padding:16px}.themes{grid-template-columns:minmax(0,380px)}}
</style><h1 data-edit-id="preview-title">テーマに馴染む、ガラスのウィジェット</h1><p>編集用Webプレビュー・架空の予定。Android／iOSの実描画・壁紙のぼかしを再現した画面ではありません。</p><main class="themes" id="themes"></main><script>
const themes={"light": ["ライト", "#ffffff", "#1a1c1e", "#585f68", "#2563eb", "#eaf1ff"], "dark": ["ダーク", "#0f1b31", "#e9f0fa", "#a3b4cc", "#5cc4e6", "#123350"], "sakura": ["桜", "#fff8fa", "#35232c", "#72505f", "#a52c62", "#fbe1ed"], "leaf": ["若葉", "#f7fcf6", "#233322", "#526a4e", "#326c36", "#dcefd9"], "ocean": ["海", "#f5fbff", "#193344", "#476577", "#086d9e", "#d8effa"], "lavender": ["ラベンダー", "#fbf8ff", "#302641", "#665577", "#7042a8", "#ebe0fa"]};
function rgb(hex){return hex.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16))}
for(const [key,[label,base,ink,secondary,accent,today]] of Object.entries(themes)){
 const tint=rgb(base).map((v,i)=>Math.round(v*.92+rgb(accent)[i]*.08));
 const section=document.createElement('section');
 section.style=`--tint:rgba(${tint},.94);--ink:${ink};--secondary:${secondary};--accent:${accent};--today:${today};--glow:${accent}0d;--edge:${accent}38`;
 section.innerHTML=`<h2 data-edit-id="${key}-name">${label}</h2><div class="wall"><div class="glass" data-edit-id="${key}-month"><div class="head"><span class="nav">▲　▼</span><span>2026/11月</span><span class="nav">＋</span></div><div class="grid">${['日','月','火','水','木','金','土'].map(v=>`<div class="weekday">${v}</div>`).join('')}${Array.from({length:35},(_,i)=>i<30?`<div class="cell ${i===2?'today':''}">${i+1}${i===2?'<div class="event">▎朝シフト</div>':''}</div>`:'<div class="cell"></div>').join('')}</div></div><div class="glass agenda" data-edit-id="${key}-day"><div class="date"><span class="nav">▲　▼</span><b>3</b><span>火曜日</span></div><div class="item"><strong>朝シフト</strong><div class="detail">今日 ・ 9:00–17:00</div></div></div></div>`;
 document.getElementById('themes').append(section);
}
</script></html>
