<!doctype html><html lang="ja"><meta charset="utf-8"><title>掲載画像1</title><style>*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{position:relative;font-family:"Yu Gothic","Meiryo",sans-serif;background:var(--bg,#f4f3ef);color:#112452} .halo{position:absolute;width:1000px;height:1000px;border-radius:50%;background:var(--halo,#e9eeef);right:-520px;top:480px;z-index:-1}header{position:absolute;left:72px;right:72px;top:45px}.brand{font-size:25px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:13px}.dot{width:13px;height:13px;background:var(--accent,#20b4ad);border-radius:50%;box-shadow:19px 0 #7355db;margin-right:19px}h1{font-size:59px;line-height:1.35;letter-spacing:-2px;margin:24px 0 10px;font-weight:700}p{font-size:28px;color:#51627d;margin:0;line-height:1.7}.screen{display:block;border:1px solid #11245219;border-radius:26px;box-shadow:0 22px 55px #11245216;overflow:hidden;background:#fff}.screen img{display:block;width:100%;height:auto}.standard{position:absolute;top:287px;left:144px;width:792px}.widget-month{position:absolute;top:344px;left:90px;width:900px}.caption{position:absolute;left:90px;right:90px;top:1635px;border-top:1px solid #11245225;padding-top:32px;display:flex;gap:20px;font-size:30px;color:#415572}.caption span{background:#ffffffaa;border:1px solid #11245210;border-radius:18px;padding:17px 28px}.small-label{font-size:31px;font-weight:700;color:#425574;margin-bottom:20px}.widget-block{position:absolute;left:80px;right:80px}.widget-block .screen{border-radius:24px}footer{position:absolute;bottom:23px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:17px;color:#7c8799}.narrow-screen{position:absolute;left:128px;top:335px;width:824px;max-height:1500px}.narrow-screen img{width:100%}.secret-note{position:absolute;left:128px;right:128px;top:1650px;font-size:25px;line-height:1.8;color:#51627d}body{--bg:#f3f4ef;--halo:#e1ebea}</style><body><div class="halo"></div><header><div class="brand"><i class="dot"></i>Multi calendar</div><h1>予定を、ひとつに。</h1><p>仕事も暮らしも、色付きラベルで見渡す。</p></header><div class="screen standard"><img class="" style="" src="/images/20260926_multi-calendar_raw-month.png"></div><footer><span>画面はサンプルデータです</span><span>01 / 08</span></footer></body></html>
