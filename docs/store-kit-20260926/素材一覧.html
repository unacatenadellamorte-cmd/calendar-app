<!doctype html><html lang="ja"><meta charset="utf-8"><title>Multi calendar 掲載素材</title><style>body{font-family:Meiryo,sans-serif;max-width:1500px;margin:auto;padding:32px;background:#edf1f4;color:#112452}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}figure{margin:0}img{width:100%;border-radius:12px}figcaption{padding:12px 0}figcaption p{font-size:13px;line-height:1.6}</style><h1>Multi calendar ｜ Google Play掲載素材</h1><p>01〜08をスマートフォンのスクリーンショット欄に番号順で使用。紹介画像とアイコンはそれぞれの専用欄へ。画面は架空のサンプルデータ。作成日：2026-09-26。</p><div class="grid"><figure><a href="../../../出力画像/20260926_multi-calendar_store-01.png"><img src="../../../出力画像/20260926_multi-calendar_store-01.png" alt="仕事も暮らしも、色付きラベルで見渡す。"></a><figcaption>01　予定を、ひとつに。<p>代替テキスト：仕事も暮らしも、色付きラベルで見渡す。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-02.png"><img src="../../../出力画像/20260926_multi-calendar_store-02.png" alt="名前・色・時間をまとめて入力。"></a><figcaption>02　いつもの予定は、タグで。<p>代替テキスト：名前・色・時間をまとめて入力。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-03.png"><img src="../../../出力画像/20260926_multi-calendar_store-03.png" alt="月末まで見渡して、▲▼で月を移動。"></a><figcaption>03　月の予定を、ホーム画面に。<p>代替テキスト：月末まで見渡して、▲▼で月を移動。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-04.png"><img src="../../../出力画像/20260926_multi-calendar_store-04.png" alt="日・週・月から、暮らしに合う表示を。"></a><figcaption>04　今日と今週を、すぐ確認。<p>代替テキスト：日・週・月から、暮らしに合う表示を。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-05.png"><img src="../../../出力画像/20260926_multi-calendar_store-05.png" alt="勤務時間を登録して、給料の目安も確認。"></a><figcaption>05　シフト入力を、もっと手軽に。<p>代替テキスト：勤務時間を登録して、給料の目安も確認。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-06.png"><img src="../../../出力画像/20260926_multi-calendar_store-06.png" alt="カレンダーの色・表示・優先順を調整。"></a><figcaption>06　大切な予定を、見つけやすく。<p>代替テキスト：カレンダーの色・表示・優先順を調整。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-07.png"><img src="../../../出力画像/20260926_multi-calendar_store-07.png" alt="予定ごとのシークレット設定に対応。"></a><figcaption>07　見せたくない予定は、非表示に。<p>代替テキスト：予定ごとのシークレット設定に対応。</p></figcaption></figure><figure><a href="../../../出力画像/20260926_multi-calendar_store-08.png"><img src="../../../出力画像/20260926_multi-calendar_store-08.png" alt="テーマや背景で、自分らしいカレンダーへ。"></a><figcaption>08　毎日使うから、好きな色に。<p>代替テキスト：テーマや背景で、自分らしいカレンダーへ。</p></figcaption></figure></div><h2>紹介画像・アイコン</h2><p><a href="../../../出力画像/20260926_multi-calendar_feature-1024x500.png">20260926_multi-calendar_feature-1024x500.png</a></p><p><a href="../../../出力画像/20260926_multi-calendar_store-icon-512.png">20260926_multi-calendar_store-icon-512.png</a></p></html>
