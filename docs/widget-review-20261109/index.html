<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Calendar ウィジェット見直し</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#e5eaf1;color:#27364a;font-family:"Segoe UI",sans-serif}h1{font-size:22px;margin:0 0 10px}p{font-size:13px;line-height:1.8;margin:0 0 20px}main{display:grid;grid-template-columns:repeat(auto-fit,400px);gap:24px}section{width:400px}h2{font-size:15px}.wall{padding:10px;background:linear-gradient(145deg,#a8bdcf,#d0c0c4,#7294aa);border-radius:30px}.glass{position:relative;border-radius:22px;background:linear-gradient(180deg,transparent 55%,#0000001a),linear-gradient(135deg,#ffffff24,transparent 42%,var(--glow)),var(--tint);box-shadow:inset 1px 1px 0 #ffffff9e,inset -1px -1px 0 var(--edge);color:var(--ink);padding:6px}.glass:before{content:"";position:absolute;inset:3px;border-radius:20px;border:1px solid #ffffff25;pointer-events:none}.head{display:flex;align-items:center;height:36px;gap:8px}.title{flex:1;text-align:center;font-weight:700;font-size:16px}.buttons{display:flex;gap:8px;width:72px}button{position:relative;border:0;border-radius:8px;background:var(--today);color:var(--accent);width:32px;height:36px;font-size:22px;cursor:pointer;overflow:hidden}.plus{width:36px;font-size:16px}.rip{position:absolute;inset:0;background:#5cc4e640;border-radius:inherit;animation:ripple .3s ease-out;pointer-events:none}@keyframes ripple{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1)}}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);height:16px;font-size:9px;text-align:center;color:var(--secondary)}svg{display:block;width:100%;height:auto}svg text{font-family:"Segoe UI",sans-serif}.note{margin-top:8px;color:#4f6179;font-size:12px}.agenda{display:flex;gap:12px;margin-top:12px;padding:12px}.date{width:72px;text-align:center}.date b{display:block;font-size:38px}.item{flex:1;border-left:4px solid #327caa;padding-left:8px}.item b{font-size:17px}.detail{font-size:12px;color:var(--secondary);margin-top:5px}.ios{margin-top:10px;padding:12px}.ios b{font-size:13px}.row{padding:8px;border-radius:10px;background:var(--today);font-size:12px;margin-top:8px;transition:opacity .22s}.fade{opacity:.35}@media(prefers-reduced-motion:reduce){.rip{animation:none}.row{transition:none}}
main{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),400px))}section{width:100%;min-width:0}@media(max-width:450px){body{padding:12px}}
</style><h1 data-edit-id="heading">ウィジェットも、本体とつながる見た目へ</h1><p data-edit-id="notice">ネイティブUIの編集用Web近似・架空データ。実機の描画や動作を証明する画面ではありません。<br>9日：予定3件→夜勤／10日：夜勤→会議。16～18日：ごみ→日またぎシフト。細い丸い縦線で段差を結び、表示順を保ちます。<br>Androidのボタンは押下の波紋、iOS 17以降はデータ更新時の短い切替。日付送りをWebだけでスライドさせる演出は付けていません。</p><main id="themes"></main>
<script>
const themes={dark:['濃紺','#0f1b31','#e9f0fa','#a3b4cc','#5cc4e6','#123350'],light:['ライト','#ffffff','#1a1c1e','#585f68','#2563eb','#eaf1ff'],sakura:['さくら','#fff8fa','#35232c','#72505f','#a52c62','#fbe1ed'],leaf:['リーフ','#f7fcf6','#233322','#526a4e','#326c36','#dcefd9'],ocean:['オーシャン','#f5fbff','#193344','#476577','#086d9e','#d8effa'],lavender:['ラベンダー','#fbf8ff','#302641','#665577','#7042a8','#ebe0fa']};
const rgb=s=>s.match(/[a-f0-9]{2}/gi).map(v=>parseInt(v,16));
const events=[...Array.from({length:3},(_,i)=>({id:'e'+i,title:'予定'+(i+1),from:9,to:9,color:'#6a68b7'})),{id:'shift',title:'夜勤',from:9,to:10,color:'#327caa'},{id:'meeting',title:'会議',from:10,to:10,color:'#8a689c'},{id:'g1',title:'可燃ごみ',from:16,to:16,color:'#b35a64'},{id:'g2',title:'可燃ごみ',from:18,to:18,color:'#b35a64'},{id:'s2',title:'夜勤',from:17,to:18,color:'#327caa'}];
function bridge(x,y,offset,half=6){const d=Math.abs(offset),o=Math.min(half,4),i=Math.min(1.5,half/2),l=-1.2,r=1.2;return `<path transform="translate(${x} ${y}) scale(1 ${offset<0?-1:1})" d="${d===0?`M-6 ${-half}H6V${half}H-6Z`:`M-6 ${-half}H${r-o}Q${r} ${-half} ${r} ${-half+o}V${d-half-i}Q${r} ${d-half} ${r+i} ${d-half}H6V${d+half}H${l+o}Q${l} ${d+half} ${l} ${d+half-o}V${half+i}Q${l} ${half} ${l-i} ${half}H-6Z`}"/>`}
function month(ink,accent,today){const w=368/7,h=100;let bg='',txt='';for(let row=0;row<5;row++){const shown=Array.from({length:7},(_,col)=>events.filter(e=>e.from<=row*7+col+1&&e.to>=row*7+col+1).slice(0,4));for(let col=0;col<7;col++){const day=row*7+col+1;if(day>30)continue;const x=col*w,y=row*h;txt+=`<text x="${x+w/2}" y="${y+13}" fill="${day===9?accent:ink}" text-anchor="middle" font-size="12">${day}</text>`;shown[col].forEach((e,lane)=>{const top=y+18+lane*12;bg+=`<rect x="${x+2}" y="${top}" width="${w-4}" height="12" rx="2" fill="${e.color}"/>`;const next=shown[col+1]?.findIndex(n=>n.id===e.id)??-1;if(next>=0)bg+=`<g fill="${e.color}">${bridge(x+w,top+6,(next-lane)*12)}</g>`;txt+=`<text x="${x+4}" y="${top+9}" fill="white" font-size="8">${e.title}</text>`})}}return `<svg viewBox="0 0 368 500" role="img" aria-label="優先順位を保ち日またぎ予定を丸い線で結ぶ月表示">${bg}${txt}</svg>`}
for(const[key,[label,base,ink,secondary,accent,today]]of Object.entries(themes)){const tint=rgb(base).map((v,i)=>Math.round(v*.92+rgb(accent)[i]*.08));const s=document.createElement('section');s.style=`--tint:rgba(${tint},.96);--ink:${ink};--secondary:${secondary};--accent:${accent};--today:${today};--glow:${accent}0d;--edge:${accent}38`;s.innerHTML=`<h2 data-edit-id="${key}-name">${label}</h2><div class="wall"><div class="glass" data-edit-id="${key}-month"><div class="head"><div class="buttons"><button aria-label="前の月">‹</button><button aria-label="次の月">›</button></div><span class="title">2026/11月</span><button class="plus" aria-label="予定追加の見た目">＋</button></div><div class="weekdays">${['日','月','火','水','木','金','土'].map(v=>'<span>'+v+'</span>').join('')}</div>${month(ink,accent,today)}</div><div class="glass agenda" data-edit-id="${key}-day"><div class="date">月曜日<b>9</b>11月</div><div class="item"><b>夜勤</b><div class="detail">今日 – 明日 ・22:00–7:00</div></div></div><div class="glass ios" data-edit-id="${key}-ios"><b>iOS 代表予定の更新イメージ</b><div class="row">22:00　シフト</div><button aria-label="iOS更新の近似を確認" style="width:auto;font-size:12px;margin-top:8px">更新を確認</button></div></div>`;s.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=document.createElement('span');r.className='rip';b.append(r);setTimeout(()=>r.remove(),350);if(b.getAttribute('aria-label')==='iOS更新の近似を確認'){const row=s.querySelector('.row');row.classList.add('fade');setTimeout(()=>{row.textContent=row.textContent.startsWith('22')?'23:00　シフト':'22:00　シフト';row.classList.remove('fade')},220)}});document.querySelector('main').append(s)}
</script></html>
