name: iOS App Store配布ビルド

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 公開バージョン（例 1.0.0）
        required: true
        type: string
      build:
        description: ビルド番号（1〜9桁の正の整数）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/ios/Gemfile
      IOS_RELEASE_VERSION: ${{ inputs.version }}
      IOS_RELEASE_BUILD: ${{ inputs.build }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ vars.GOOGLE_IOS_REVERSED_CLIENT_ID }}
      VITE_ADMOB_PLATFORM: ios
      VITE_ADMOB_MODE: production
      ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
      VITE_ADMOB_IOS_BANNER_ID: ${{ vars.VITE_ADMOB_IOS_BANNER_ID }}
      VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: xcodebuild -version
      - run: npm ci
      - name: 手動入力と公開設定の不足を検出
        run: |
          node --input-type=module -e "import {validateReleaseEnv,validateReleaseVersion} from './scripts/ios/build-release-web.mjs'; validateReleaseEnv(process.env); validateReleaseVersion(process.env.IOS_RELEASE_VERSION,process.env.IOS_RELEASE_BUILD);"
      - name: 配布秘密の不足を検出
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          for name in ('APPLE_TEAM_ID', 'IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD', 'IOS_APP_PROFILE_BASE64', 'IOS_WIDGET_PROFILE_BASE64'):
              if not os.environ.get(name):
                  raise SystemExit(name + 'が未設定です。')
          PY
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/ios/*.test.mjs
      - run: python3 scripts/ios/test-release-signing.py
      - run: python3 scripts/ios/test-google-authorization.py
      - run: npm run build:ios:release
      - run: npx cap sync ios
      - name: ネイティブ構成の生成と冪等性を検証
        run: |
          bundle exec ruby scripts/ios/test-widget-target.rb
          bundle exec ruby scripts/ios/add-widget-target.rb
          swift test --package-path ios/App/FeaturedEventsWidget
      - name: 配布署名・archive・IPAを検証
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          trap 'python3 scripts/ios/release-signing.py cleanup' EXIT
          python3 scripts/ios/release-signing.py
      - name: 一時鍵とプロファイルを削除
        if: always()
        run: python3 scripts/ios/release-signing.py cleanup
      - name: 検証済みIPAとdSYMを保存
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-ipa
          path: |
            ios-release-artifacts/Multi-calendar.ipa
            ios-release-artifacts/Multi-calendar-dSYMs.zip
          if-no-files-found: error
          retention-days: 7
