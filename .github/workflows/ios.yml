name: iOSビルド検証

on:
  push:
    branches: [main, 'feature/ios-widget-ci']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web側の回帰検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 接続設定を持たないコンパイル検証専用。実機利用時はbuild:ios:deviceで再ビルドする。
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ios:
    name: Swift検証と署名なしシミュレータビルド
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/ios/Gemfile
      # 検証成果物にはiOS公式テスト広告だけを組み込む。
      VITE_ADMOB_PLATFORM: ios
      VITE_ADMOB_MODE: test
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: ターゲット生成と再実行の安全性を検証
        run: bundle exec ruby scripts/ios/test-widget-target.rb
      - name: ウィジェットをXcodeプロジェクトに追加
        run: bundle exec ruby scripts/ios/add-widget-target.rb
      - name: Swiftの共有データ契約を検証
        run: swift test --package-path ios/App/FeaturedEventsWidget
      - name: アプリとウィジェットをビルド
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=1.0.19 CURRENT_PROJECT_VERSION=20 build 2>&1 | tee ios-build.log
          test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/FeaturedEventsWidget.appex
      - name: 実機向け署名なしアーカイブを作成
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ios/UnsignedApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=1.0.19 CURRENT_PROJECT_VERSION=20 \
            archive 2>&1 | tee ios-archive.log
          test -d ios/UnsignedApp.xcarchive/Products/Applications/App.app/PlugIns/FeaturedEventsWidget.appex
      - name: 署名なし成果物を保存
        shell: bash
        run: |
          tar -czf ios-simulator-app.tar.gz -C ios/DerivedData/Build/Products/Debug-iphonesimulator App.app
          tar -czf ios-unsigned-archive.tar.gz -C ios UnsignedApp.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-builds
          path: |
            ios-simulator-app.tar.gz
            ios-unsigned-archive.tar.gz
          retention-days: 7
      - name: ビルドログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios-build.log
            ios-archive.log
          if-no-files-found: ignore
          retention-days: 7
